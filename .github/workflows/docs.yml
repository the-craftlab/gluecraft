#=============================================================================
# DOCS DEPLOYMENT WORKFLOW
#=============================================================================
# Deploys documentation to Vercel when docs change on develop or main.
# Uses Vercel's automatic deployment with custom domain: gluecraft.thecraftlab.dev
#
# Triggers:
#   - Push to develop/main with changes in docs/
#   - Manual workflow_dispatch
#
# Note: This workflow triggers Vercel deployment via push. Vercel should be
# configured with:
#   - Root Directory: docs
#   - Framework: Docusaurus 2
#   - Build Command: pnpm build
#   - Output Directory: build
#=============================================================================

name: Deploy Docs

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to display in docs (e.g., v0.8.0)'
        required: false
        type: string

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.20.0'

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get version from latest tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Docs version: $VERSION"

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        env:
          GLUECRAFT_DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build
          retention-days: 7

  # Note: Vercel deploys automatically on push via its GitHub integration.
  # This job just validates the build. If you need to deploy via CLI instead,
  # uncomment the deploy job below and add VERCEL_TOKEN, VERCEL_ORG_ID, 
  # and VERCEL_PROJECT_ID secrets.
  
