#=============================================================================
# DOCS BUILD AND DEPLOYMENT
#=============================================================================
# Builds and deploys documentation to GitHub Pages.
# Triggered on push to main when docs change, or manually via workflow_dispatch.
#
# Custom domain: gluecraft.thecraftlab.dev
# Configure in repo Settings > Pages > Custom domain
#=============================================================================

name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to display in docs (e.g., v0.8.0)'
        required: false
        type: string

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.20.0'

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get version from latest tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Docs version: $VERSION"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd docs && pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        working-directory: docs
        env:
          GLUECRAFT_DOCS_VERSION: ${{ steps.version.outputs.version }}
          NODE_ENV: production
        run: pnpm build

      - name: Upload docs build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build
          retention-days: 1

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs build artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
