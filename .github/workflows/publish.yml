name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The git tag to publish (e.g., v1.2.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'The git tag to publish (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Set npm version from tag
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          # Remove 'v' prefix if present
          VERSION_NUM="${VERSION#v}"
          echo "📝 Setting package.json version to $VERSION_NUM"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION_NUM';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public
