name: 'Create Release'
description: 'Create a GitHub release and publish to npm using release-it'
author: 'PipeCraft'

inputs:
  version:
    description: 'Version to release (e.g., v1.2.3)'
    required: true
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ${{ github.token }}
  npm-token:
    description: 'NPM token for publishing (required for npm publish)'
    required: false
    default: ''
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10.20.0'

outputs:
  release_url:
    description: 'The URL of the created release'
    value: ${{ steps.release.outputs.release_url }}
  release_id:
    description: 'The ID of the created release'
    value: ${{ steps.release.outputs.release_id }}

runs:
  using: 'composite'
  steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build package
      shell: bash
      run: pnpm run build

    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Update package.json version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        # Remove 'v' prefix if present
        VERSION_NUM="${VERSION#v}"
        echo "📝 Setting package.json version to $VERSION_NUM"
        node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION_NUM';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        "

    - name: Create GitHub Release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        VERSION="${{ inputs.version }}"
        echo "📦 Creating GitHub release for $VERSION"

        # Generate release notes from commits since last tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -n "$PREVIOUS_TAG" ]; then
          echo "📝 Generating release notes from $PREVIOUS_TAG to HEAD"
          RELEASE_NOTES=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s" --no-merges)
        else
          echo "📝 Generating release notes from all commits"
          RELEASE_NOTES=$(git log --pretty=format:"- %s" --no-merges | head -50)
        fi

        # Check if release already exists
        if gh release view "$VERSION" &>/dev/null; then
          echo "⚠️  Release $VERSION already exists, skipping creation"
          RELEASE_URL=$(gh release view "$VERSION" --json url --jq '.url')
        else
          # Create release with notes
          RELEASE_OUTPUT=$(gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "$RELEASE_NOTES" \
            --latest 2>&1)
          RELEASE_URL=$(echo "$RELEASE_OUTPUT" | grep -oE 'https://github.com/.*/releases/.*' || echo "")
        fi

        echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT

        # Get release ID using gh api
        RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$VERSION --jq '.id' 2>/dev/null || echo "")
        echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

        echo "✅ GitHub release ready"
        echo "🔗 URL: $RELEASE_URL"

    - name: Publish to npm
      if: inputs.npm-token != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: |
        VERSION="${{ inputs.version }}"
        VERSION_NUM="${VERSION#v}"
        echo "📦 Publishing @thecraftlab/gluecraft@$VERSION_NUM to npm"

        pnpm publish --no-git-checks --access public

        echo "✅ Published to npm"
        echo "🔗 https://www.npmjs.com/package/@thecraftlab/gluecraft/v/$VERSION_NUM"

    - name: Skip npm publish (no token)
      if: inputs.npm-token == ''
      shell: bash
      run: |
        echo "ℹ️  NPM_TOKEN not provided - skipping npm publish"
        echo "   To enable npm publishing, add NPM_TOKEN secret to your repository"