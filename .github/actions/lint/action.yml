name: 'Lint Code'
description: 'Run ESLint and Prettier checks on the codebase'
author: 'Gluecraft'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10.20.0'
  eslint:
    description: 'Run ESLint checks'
    required: false
    default: 'true'
  prettier:
    description: 'Run Prettier format checks'
    required: false
    default: 'true'
  typecheck:
    description: 'Run TypeScript type checks'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for commands'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "📦 Installing dependencies..."
        pnpm install --frozen-lockfile || pnpm install

    - name: Run ESLint
      if: inputs.eslint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🔍 Running ESLint..."
        if [ -f "package.json" ] && grep -q '"lint"' package.json; then
          pnpm run lint
        else
          echo "⚠️  No lint script found, skipping ESLint"
        fi

    - name: Run Prettier
      if: inputs.prettier == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "✨ Checking code formatting with Prettier..."
        if [ -f "package.json" ] && grep -q '"format:check"' package.json; then
          pnpm run format:check
        else
          echo "⚠️  No format:check script found, skipping Prettier"
        fi

    - name: Run TypeScript type check
      if: inputs.typecheck == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🔬 Running TypeScript type check..."
        if [ -f "package.json" ] && grep -q '"typecheck"' package.json; then
          pnpm run typecheck
        elif [ -f "tsconfig.json" ]; then
          pnpm exec tsc --noEmit
        else
          echo "⚠️  No typecheck script or tsconfig.json found, skipping"
        fi
